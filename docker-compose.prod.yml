services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    command: sh -c "(python manage.py db_worker --queue-name seeds &) && (python manage.py db_worker --queue-name seeds &) && gunicorn smrpg_web_randomizer.wsgi:application --bind 0.0.0.0:8000 --timeout 3600 -w 4"
    volumes:
      - static_volume:/home/app/web/staticfiles
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal
    expose:
      - 8000
    env_file:
      - ./.env.prod
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
  db:
    image: postgres:18
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal
    env_file:
      - ./.env.prod.db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@localhost/$$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
  cache:
    image: memcached:1.6
    networks:
      - internal
    expose:
      - 11211
  nginx:
    build: ./nginx
    restart: always
    volumes:
      - static_volume:/home/app/web/staticfiles
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
      - internal
    expose:
      - 80
    # Uncomment for testing production setup on local system.
#    ports:
#      - "8000:80"
    env_file:
      - ./.env.prod.nginx
    depends_on:
      - web

networks:
  default:
  internal:
    internal: true

volumes:
  postgres_data:
  static_volume:
